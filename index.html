<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5d3b">
  <title>Be The Agent</title>
  <!-- 배포할 때마다 ?v= 숫자를 올림 (GitHub Pages 10분 캐시에 옛 파일이 섞이지 않게) -->
  <!-- 가장 많이 쓰는 굵기(본문)는 미리 받아 글꼴이 바뀌는 깜빡임을 줄임 -->
  <link rel="preload" href="fonts/Pretendard-Regular.subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=24">
  <script src="game.js?v=24" defer></script>
</head>
<body>
  <!-- 상단: 시즌·주차, 자금, 평판, 행동력 -->
  <header class="topbar">
    <span id="hdr-date" class="hdr-date">1시즌 · 1주</span>
    <span class="hdr-item"><b id="hdr-cash">$25,000</b></span>
    <span class="hdr-item">평판 <b id="hdr-rep">12</b></span>
    <span class="hdr-item">AP <b id="hdr-ap">3/3</b></span>
  </header>

  <main id="view" class="view"></main>

  <!-- 하단: 탭 4개와 다음 주 버튼 -->
  <nav class="bottombar" aria-label="메뉴">
    <button type="button" class="tab" data-tab="clients">내 선수</button>
    <button type="button" class="tab" data-tab="world">리그</button>
    <button type="button" id="tab-agency" class="tab" data-tab="agency">에이전시</button>
    <button type="button" class="tab" data-tab="log">기록</button>
    <button type="button" id="btn-next" class="next">다음 주 ▶</button>
  </nav>

  <!-- 시즌 결산 -->
  <dialog id="summary" class="sheet" aria-labelledby="summary-title">
    <h2 id="summary-title" class="title"></h2>
    <div id="summary-body"></div>
    <button type="button" id="summary-close" class="btn primary">확인</button>
  </dialog>

  <!-- 관계 이야기 장면: 다음 주를 누른 뒤 아래에서 올라오는 시트 (디자인 시안 B) -->
  <dialog id="scene" class="sheet scene" aria-labelledby="scene-title">
    <span class="grip" aria-hidden="true"></span>
    <div id="scene-who" class="scene-who"></div>
    <!-- 시트가 열리면 답 버튼이 아니라 이야기 문장에 먼저 초점 (화면 읽기 순서, 잘못 누르기 방지) -->
    <h2 id="scene-title" class="scene-title" tabindex="-1" autofocus></h2>
    <div id="scene-body"></div>
    <button type="button" id="scene-close" class="btn wide">나중에 답하기</button>
  </dialog>

  <!-- 파산 -->
  <dialog id="gameover" class="sheet" aria-labelledby="gameover-title">
    <h2 id="gameover-title" class="title">에이전시 파산</h2>
    <p id="gameover-body" class="sub"></p>
    <button type="button" id="gameover-new" class="btn primary">새 게임 시작</button>
    <button type="button" id="gameover-close" class="btn wide">기록만 보기</button>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
</body>
</html>
